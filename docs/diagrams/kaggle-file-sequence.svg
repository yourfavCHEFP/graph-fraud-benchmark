<svg width="900" height="1680" viewBox="0 0 900 1680" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe Print','Bradley Hand','Comic Sans MS',cursive" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="1680" fill="#fffdf7"/>

  <text x="450" y="60" text-anchor="middle" font-size="30" font-weight="700" fill="#1e1e1e">graph-fraud-benchmark</text>
  <text x="450" y="92" text-anchor="middle" font-size="18" fill="#495057">the file-by-file build order, in order you actually write them</text>

  <!-- arrow marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1e1e1e"/>
    </marker>
  </defs>

  <!-- Box template values: x=140 width=620 -->

  <!-- 1 -->
  <g transform="rotate(-0.6 450 190)">
    <path d="M158,140 L740,140 Q752,140 752,152 L752,228 Q752,240 740,240 L158,240 Q146,240 146,228 L146,152 Q146,140 158,140 Z"
          fill="#ffec99" stroke="#f08c00" stroke-width="2.5"/>
  </g>
  <circle cx="100" cy="190" r="26" fill="#fff3bf" stroke="#f08c00" stroke-width="2.5"/>
  <text x="100" y="198" text-anchor="middle" font-size="24" font-weight="700" fill="#e8590c">1</text>
  <text x="450" y="172" text-anchor="middle" font-size="20" font-weight="700" fill="#1e1e1e">sample_subgraphs.py</text>
  <text x="450" y="198" text-anchor="middle" font-size="14" fill="#495057">The net — scoops a few transaction "neighborhoods" out of</text>
  <text x="450" y="218" text-anchor="middle" font-size="14" fill="#495057">the big fraud pond, so we're not looking at everything at once.</text>
  <path d="M450,240 Q460,270 450,300" stroke="#1e1e1e" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>

  <!-- 2 -->
  <g transform="rotate(0.5 450 350)">
    <path d="M158,300 L740,300 Q752,300 752,312 L752,388 Q752,400 740,400 L158,400 Q146,400 146,388 L146,312 Q146,300 158,300 Z"
          fill="#b2f2bb" stroke="#2f9e44" stroke-width="2.5"/>
  </g>
  <circle cx="100" cy="350" r="26" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2.5"/>
  <text x="100" y="358" text-anchor="middle" font-size="24" font-weight="700" fill="#2f9e44">2</text>
  <text x="450" y="332" text-anchor="middle" font-size="20" font-weight="700" fill="#1e1e1e">serialize.py</text>
  <text x="450" y="358" text-anchor="middle" font-size="14" fill="#495057">The translator — turns each scooped-up neighborhood into</text>
  <text x="450" y="378" text-anchor="middle" font-size="14" fill="#495057">plain sentences a chatbot can actually read (no label leaked!).</text>
  <path d="M450,400 Q440,430 450,460" stroke="#1e1e1e" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>

  <!-- 3 -->
  <g transform="rotate(-0.4 450 510)">
    <path d="M158,460 L740,460 Q752,460 752,472 L752,548 Q752,560 740,560 L158,560 Q146,560 146,548 L146,472 Q146,460 158,460 Z"
          fill="#a5d8ff" stroke="#1971c2" stroke-width="2.5"/>
  </g>
  <circle cx="100" cy="510" r="26" fill="#d0ebff" stroke="#1971c2" stroke-width="2.5"/>
  <text x="100" y="518" text-anchor="middle" font-size="24" font-weight="700" fill="#1971c2">3</text>
  <text x="450" y="492" text-anchor="middle" font-size="20" font-weight="700" fill="#1e1e1e">data/labels.csv</text>
  <text x="450" y="518" text-anchor="middle" font-size="14" fill="#495057">The answer key — quietly holds the real fraud/legit answer,</text>
  <text x="450" y="538" text-anchor="middle" font-size="14" fill="#495057">plus the GNN's own guess, so we can grade everyone later.</text>
  <path d="M450,560 Q460,590 450,620" stroke="#1e1e1e" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>

  <!-- 4 -->
  <g transform="rotate(0.6 450 670)">
    <path d="M158,620 L740,620 Q752,620 752,632 L752,708 Q752,720 740,720 L158,720 Q146,720 146,708 L146,632 Q146,620 158,620 Z"
          fill="#d0bfff" stroke="#7048e8" stroke-width="2.5"/>
  </g>
  <circle cx="100" cy="670" r="26" fill="#e5dbff" stroke="#7048e8" stroke-width="2.5"/>
  <text x="100" y="678" text-anchor="middle" font-size="24" font-weight="700" fill="#7048e8">4</text>
  <text x="450" y="652" text-anchor="middle" font-size="20" font-weight="700" fill="#1e1e1e">models.py</text>
  <text x="450" y="678" text-anchor="middle" font-size="14" fill="#495057">The guest list — writes down which 3-4 AI models we're</text>
  <text x="450" y="698" text-anchor="middle" font-size="14" fill="#495057">inviting to sit the test.</text>
  <path d="M450,720 Q440,750 450,780" stroke="#1e1e1e" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>

  <!-- 5 -->
  <g transform="rotate(-0.5 450 830)">
    <path d="M158,780 L740,780 Q752,780 752,792 L752,868 Q752,880 740,880 L158,880 Q146,880 146,868 L146,792 Q146,780 158,780 Z"
          fill="#ffc9c9" stroke="#e03131" stroke-width="2.5"/>
  </g>
  <circle cx="100" cy="830" r="26" fill="#ffe3e3" stroke="#e03131" stroke-width="2.5"/>
  <text x="100" y="838" text-anchor="middle" font-size="24" font-weight="700" fill="#e03131">5</text>
  <text x="450" y="812" text-anchor="middle" font-size="20" font-weight="700" fill="#1e1e1e">tasks.py  (@kbench.task)</text>
  <text x="450" y="838" text-anchor="middle" font-size="14" fill="#495057">The exam questions — the actual prompts we hand each model:</text>
  <text x="450" y="858" text-anchor="middle" font-size="14" fill="#495057">"is this fraud?" and "who's the ringleader?"</text>
  <path d="M450,880 Q460,910 450,940" stroke="#1e1e1e" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>

  <!-- 6 -->
  <g transform="rotate(0.4 450 990)">
    <path d="M158,940 L740,940 Q752,940 752,952 L752,1028 Q752,1040 740,1040 L158,1040 Q146,1040 146,1028 L146,952 Q146,940 158,940 Z"
          fill="#ffd8a8" stroke="#e8590c" stroke-width="2.5"/>
  </g>
  <circle cx="100" cy="990" r="26" fill="#ffe8cc" stroke="#e8590c" stroke-width="2.5"/>
  <text x="100" y="998" text-anchor="middle" font-size="24" font-weight="700" fill="#e8590c">6</text>
  <text x="450" y="972" text-anchor="middle" font-size="20" font-weight="700" fill="#1e1e1e">assertions.py</text>
  <text x="450" y="998" text-anchor="middle" font-size="14" fill="#495057">The rubric — decides if an answer counts as "right," and</text>
  <text x="450" y="1018" text-anchor="middle" font-size="14" fill="#495057">whether the reasoning actually used the graph, or just guessed.</text>
  <path d="M450,1040 Q440,1070 450,1100" stroke="#1e1e1e" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>

  <!-- 7 -->
  <g transform="rotate(-0.6 450 1150)">
    <path d="M158,1100 L740,1100 Q752,1100 752,1112 L752,1188 Q752,1200 740,1200 L158,1200 Q146,1200 146,1188 L146,1112 Q146,1100 158,1100 Z"
          fill="#99e9f2" stroke="#0c8599" stroke-width="2.5"/>
  </g>
  <circle cx="100" cy="1150" r="26" fill="#c5f6fa" stroke="#0c8599" stroke-width="2.5"/>
  <text x="100" y="1158" text-anchor="middle" font-size="24" font-weight="700" fill="#0c8599">7</text>
  <text x="450" y="1132" text-anchor="middle" font-size="20" font-weight="700" fill="#1e1e1e">analysis.py</text>
  <text x="450" y="1158" text-anchor="middle" font-size="14" fill="#495057">The report card — lines up every model's answers next to the</text>
  <text x="450" y="1178" text-anchor="middle" font-size="14" fill="#495057">GNN's answers, so the real story shows up in one table.</text>
  <path d="M450,1200 Q460,1230 450,1260" stroke="#1e1e1e" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>

  <!-- 8 -->
  <g transform="rotate(0.5 450 1310)">
    <path d="M158,1260 L740,1260 Q752,1260 752,1272 L752,1348 Q752,1360 740,1360 L158,1360 Q146,1360 146,1348 L146,1272 Q146,1260 158,1260 Z"
          fill="#e9ecef" stroke="#495057" stroke-width="2.5"/>
  </g>
  <circle cx="100" cy="1310" r="26" fill="#f1f3f5" stroke="#495057" stroke-width="2.5"/>
  <text x="100" y="1318" text-anchor="middle" font-size="24" font-weight="700" fill="#495057">8</text>
  <text x="450" y="1292" text-anchor="middle" font-size="20" font-weight="700" fill="#1e1e1e">kaggle_benchmark_task.ipynb</text>
  <text x="450" y="1318" text-anchor="middle" font-size="14" fill="#495057">The stage — the one file that performs live, in front of the</text>
  <text x="450" y="1338" text-anchor="middle" font-size="14" fill="#495057">Kaggle judges. Everything above gets imported in here.</text>
  <path d="M450,1360 Q440,1390 450,1420" stroke="#1e1e1e" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>

  <!-- 9 -->
  <g transform="rotate(-0.4 450 1470)">
    <path d="M158,1420 L740,1420 Q752,1420 752,1432 L752,1508 Q752,1520 740,1520 L158,1520 Q146,1520 146,1508 L146,1432 Q146,1420 158,1420 Z"
          fill="#d8f5a2" stroke="#66a80f" stroke-width="2.5"/>
  </g>
  <circle cx="100" cy="1470" r="26" fill="#eefbd6" stroke="#66a80f" stroke-width="2.5"/>
  <text x="100" y="1478" text-anchor="middle" font-size="24" font-weight="700" fill="#66a80f">9</text>
  <text x="450" y="1452" text-anchor="middle" font-size="20" font-weight="700" fill="#1e1e1e">writeup/devto_submission.md</text>
  <text x="450" y="1478" text-anchor="middle" font-size="14" fill="#495057">The story — turns the report card into a write-up humans</text>
  <text x="450" y="1498" text-anchor="middle" font-size="14" fill="#495057">(and judges) actually want to read.</text>

  <text x="450" y="1580" text-anchor="middle" font-size="15" fill="#868e96">start at 1, finish at 9 — don't skip ahead, each file feeds the next one</text>
  <text x="450" y="1610" text-anchor="middle" font-size="13" fill="#adb5bd">github.com/yourfavCHEFP/graph-fraud-benchmark</text>
</svg>
